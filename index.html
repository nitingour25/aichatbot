<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #212121;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           APP
        ========================== */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 260px;
            background: #171717;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 25px;
            padding: 8px;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #171717, #171717);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .new-chat {
            border: 1px solid #444;
            background: #212121;
            color: white;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: #2f2f2f;
        }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .sidebar-item {
            padding: 10px;
            color: #bdbdbd;
            font-size: 14px;
            border-radius: 7px;
        }

        .sidebar-item:hover {
            background: #2a2a2a;
            color: white;
        }

        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* HEADER */

        .header {
            height: 60px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 22px;
            background: #212121;
        }

        .mobile-menu {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 23px;
            margin-right: 15px;
            cursor: pointer;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            margin-left: 10px;
            color: #06e733;
            font-size: 12px;
        }

        /* =========================
           CHAT AREA
        ========================== */

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 15px 150px;
            scroll-behavior: smooth;
        }

        .messages {
            max-width: 850px;
            margin: auto;
        }

        /* WELCOME */

        .welcome {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-icon {
            width: 1px;
            height: 1px;
            border-radius: 18px;
            background: linear-gradient(135deg, #ff0000, #ff0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px hsl(0, 0%, 0%);
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #a0a0a0;
            font-size: 15px;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .user-avatar {
            background: #2a2a2a;
        }

        .ai-avatar {
            background: linear-gradient(135deg, #2a2a2a, #2a2a2a);
        }

        .message-content {
            flex: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding-top: 5px;
            font-size: 15px;
        }

        .user-message .message-content {
            color: #eeeeee;
        }

        .ai-message .message-content {
            color: #eeeeee;
        }

        /* =========================
           TYPING
        ========================== */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding-top: 10px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: #aaa;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* =========================
           INPUT AREA
        ========================== */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            padding: 20px 15px 25px;
            background: linear-gradient(
                to top,
                #212121 70%,
                rgba(33, 33, 33, 0)
            );
        }

        .input-wrapper {
            max-width: 850px;
            margin: auto;
            position: relative;
        }

        .chat-form {
            background: #2f2f2f;
            border: 1px solid #555;
            border-radius: 15px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            min-height: 25px;
            max-height: 150px;
            padding: 8px 10px;
        }

        #messageInput::placeholder {
            color: #999;
        }

        .send-button {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            background: #2f2f2f;
            color: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .send-button:hover {
            background: #030303;
            transform: scale(1.03);
        }

        .send-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            text-align: center;
            color: #777;
            font-size: 11px;
            margin-top: 8px;
        }

        /* =========================
           CLEAR BUTTON
        ========================== */

        .clear-button {
            margin-top: 8px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            text-align: center;
        }

        .clear-button:hover {
            color: white;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            .sidebar {
                position: fixed;
                left: -270px;
                top: 0;
                bottom: 0;
                z-index: 1000;
                transition: 0.3s;
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .input-area {
                left: 0;
                padding: 15px 10px 20px;
            }

            .chat-container {
                padding-left: 10px;
                padding-right: 10px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .message {
                gap: 10px;
            }

            .avatar {
                width: 30px;
                height: 30px;
                min-width: 30px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-icon">🐼</div>
            <span>Daddy AI Chatbot</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="sidebar-bottom">

            <div class="sidebar-item">
                🐼 AI Assistant
            </div>

            <div class="sidebar-item">
                ⚡ Powered by AII
            </div>

            <button class="clear-button" onclick="clearChat()">
                Clear conversation
            </button>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <button class="mobile-menu" onclick="toggleSidebar()">
                ☰
            </button>

            <div class="header-title">
                Daddy AI Chatbot
            </div>

            <div class="status">
                ● Online
            </div>

        </header>


        <!-- CHAT -->
        <div class="chat-container" id="chatContainer">

            <div class="messages" id="messages">

                <!-- WELCOME -->
                <div class="welcome" id="welcome">

                    <div class="welcome-icon">
                        🐼
                    </div>

                    <h1>hello nitin,How can I help you?</h1>

                    <p>
                        Ask me anything and I'll do my best to help.
                    </p>

                </div>

            </div>

        </div>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-wrapper">

                <form class="chat-form" id="chatForm">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message My AI Chatbot..."
                        autocomplete="off"
                    ></textarea>

                    <button
                        type="submit"
                        class="send-button"
                        id="sendButton"
                        title="Send"
                    >
                        ➤
                    </button>

                </form>

                <div class="hint">
                    AI can make mistakes. Check important information.
                </div>

            </div>

        </div>

    </main>

</div>


<script>

    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const chatContainer = document.getElementById("chatContainer");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");
    const sidebar = document.getElementById("sidebar");


    // =========================
    // SEND MESSAGE
    // =========================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const message = input.value.trim();

        if (!message) {
            return;
        }

        // Hide welcome screen
        if (welcome) {
            welcome.style.display = "none";
        }

        // Add user message
        addMessage("user", message);

        // Clear input
        input.value = "";
        autoResize();

        // Disable button
        sendButton.disabled = true;

        // Show typing
        const typingElement = showTyping();

        try {

            const response = await fetch("/.netlify/functions/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


            const data = await response.json();


            // Remove typing indicator
            typingElement.remove();


            if (response.ok) {

                addMessage(
                    "ai",
                    data.reply || "I couldn't generate a response."
                );

            } else {

                addMessage(
                    "ai",
                    data.reply || "Something went wrong."
                );

            }


        } catch (error) {

            typingElement.remove();

            addMessage(
                "ai",
                "⚠️ Unable to connect to the server. Please try again."
            );

            console.error(error);

        }


        // Enable button
        sendButton.disabled = false;

        input.focus();

    });


    // =========================
    // ADD MESSAGE
    // =========================

    function addMessage(type, text) {

        const messageDiv = document.createElement("div");

        messageDiv.className =
            "message " +
            (type === "user" ? "user-message" : "ai-message");


        const avatar = document.createElement("div");

        avatar.className =
            "avatar " +
            (type === "user" ? "user-avatar" : "ai-avatar");


        avatar.textContent =
            type === "user" ? "🫵" : "🐼";


        const content = document.createElement("div");

        content.className = "message-content";

        // textContent prevents HTML injection
        content.textContent = text;


        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        messages.appendChild(messageDiv);


        scrollToBottom();
    }


    // =========================
    // TYPING INDICATOR
    // =========================

    function showTyping() {

        const messageDiv = document.createElement("div");

        messageDiv.className = "message ai-message";


        const avatar = document.createElement("div");

        avatar.className = "avatar ai-avatar";

        avatar.textContent = "🐼";


        const typing = document.createElement("div");

        typing.className = "typing";

        typing.innerHTML = `
            <span></span>
            <span></span>
            <span></span>
        `;


        messageDiv.appendChild(avatar);
        messageDiv.appendChild(typing);

        messages.appendChild(messageDiv);

        scrollToBottom();

        return messageDiv;
    }


    // =========================
    // SCROLL
    // =========================

    function scrollToBottom() {

        setTimeout(() => {

            chatContainer.scrollTop =
                chatContainer.scrollHeight;

        }, 50);

    }


    // =========================
    // ENTER TO SEND
    // =========================

    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            form.requestSubmit();

        }

    });


    // =========================
    // AUTO RESIZE TEXTAREA
    // =========================

    input.addEventListener("input", autoResize);


    function autoResize() {

        input.style.height = "auto";

        input.style.height =
            Math.min(input.scrollHeight, 150) + "px";

    }


    // =========================
    // NEW CHAT
    // =========================

    function newChat() {

        messages.innerHTML = "";

        const newWelcome = document.createElement("div");

        newWelcome.className = "welcome";

        newWelcome.id = "welcome";

        newWelcome.innerHTML = `
            <div class="welcome-icon">🐼</div>

            <h1> hello nitin,How can I help you?</h1>

            <p>
                Ask me anything and I'll do my best to help.
            </p>
        `;

        messages.appendChild(newWelcome);

        input.value = "";

        autoResize();

        input.focus();

        closeSidebar();

    }


    // =========================
    // CLEAR CHAT
    // =========================

    function clearChat() {

        if (
            confirm("Clear this conversation?")
        ) {

            newChat();

        }

    }


    // =========================
    // MOBILE SIDEBAR
    // =========================

    function toggleSidebar() {

        sidebar.classList.toggle("open");

    }


    function closeSidebar() {

        sidebar.classList.remove("open");

    }


    // =========================
    // START
    // =========================

    input.focus();

</script>

</body>
</html>
